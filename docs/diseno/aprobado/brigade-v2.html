&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;brigade-v2&#x27;);
const I=name=&gt;`&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
const E=v=&gt;String(v).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
const F=v=&gt;new Intl.NumberFormat(&#x27;es-UY&#x27;,{maximumFractionDigits:2}).format(v);
const initial={screen:&#x27;home&#x27;,offline:false,role:&#x27;Chef&#x27;,portions:40,produced:20,pending:0,recipe:&#x27;Crema de calabaza&#x27;,recipeTab:&#x27;Ingredientes&#x27;,productionTab:&#x27;Cantidades&#x27;,captureTab:&#x27;Revisión&#x27;,source:&#x27;WhatsApp&#x27;,question:0,salt:&#x27;&#x27;,weight:&#x27;&#x27;,reviewed:false,recipeSaved:false,search:&#x27;&#x27;,filter:&#x27;Todas&#x27;,done:[true,false,false],orderStatus:&#x27;Borrador&#x27;,stock:5,toast:&#x27;&#x27;,confirm:false,sourceNote:&#x27;&#x27;,eventName:&#x27;Almuerzo de bienvenida&#x27;};
const apps={};
function mount(id,key){
const app=document.getElementById(id);const previous=window.openai?.widgetState?.privateContent?.v2?.[key];const s={...initial,...(previous||{}),done:[...(previous?.done||initial.done)]};apps[key]=s;
const options={glow:.19};
const B=(text,action,quiet=false,disabled=false)=&gt;`&lt;button type=&quot;button&quot; class=&quot;b2-button ${quiet?&#x27;quiet&#x27;:&#x27;&#x27;}&quot; data-go=&quot;${action}&quot; ${disabled?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;${text}&lt;/button&gt;`;
const full=(text,action,disabled=false)=&gt;`&lt;button type=&quot;button&quot; class=&quot;b2-button full&quot; data-go=&quot;${action}&quot; ${disabled?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;${text}&lt;/button&gt;`;
const tag=(text,kind=&#x27;&#x27;)=&gt;`&lt;span class=&quot;b2-tag ${kind}&quot;&gt;&lt;span class=&quot;b2-dot&quot;&gt;&lt;/span&gt;${text}&lt;/span&gt;`;
const H=(eyebrow,title,sub=&#x27;&#x27;)=&gt;`&lt;div class=&quot;b2-pagehead&quot;&gt;&lt;div class=&quot;b2-eyebrow&quot;&gt;${eyebrow}&lt;/div&gt;&lt;h1&gt;${title}&lt;/h1&gt;${sub?`&lt;p class=&quot;b2-sub&quot;&gt;${sub}&lt;/p&gt;`:&#x27;&#x27;}&lt;/div&gt;`;
const back=(text,action)=&gt;`&lt;button class=&quot;b2-link b2-back&quot; data-go=&quot;${action}&quot;&gt;${I(&#x27;arrow-left&#x27;)}${text}&lt;/button&gt;`;
const allNav=[[&#x27;home&#x27;,&#x27;Hoy&#x27;,&#x27;sun&#x27;],[&#x27;recipes&#x27;,&#x27;Recetas&#x27;,&#x27;book-open&#x27;],[&#x27;production&#x27;,&#x27;Cocina&#x27;,&#x27;cooking-pot&#x27;],[&#x27;orders&#x27;,&#x27;Pedidos&#x27;,&#x27;shopping-basket&#x27;],[&#x27;stock&#x27;,&#x27;Stock&#x27;,&#x27;boxes&#x27;],[&#x27;tasks&#x27;,&#x27;Equipo&#x27;,&#x27;users&#x27;],[&#x27;events&#x27;,&#x27;Eventos&#x27;,&#x27;calendar-days&#x27;]];
function persist(){window.openai?.setWidgetState?.({modelContent:{revision:2,view:key,page:s.screen,role:s.role,offline:s.offline},privateContent:{v2:Object.fromEntries(Object.entries(apps).map(([k,v])=&gt;[k,{...v,toast:&#x27;&#x27;}]))}}).catch(()=&gt;{});}
function stockRows(){const f=s.portions/20;return [[&#x27;Calabaza&#x27;,3,.8,s.stock,&#x27;kg&#x27;],[&#x27;Cebolla&#x27;,.6,.9,2,&#x27;kg&#x27;],[&#x27;Crema de leche&#x27;,.4,1,.3,&#x27;L&#x27;],[&#x27;Caldo&#x27;,2,1,5,&#x27;L&#x27;]].map(([name,net,yieldRatio,available,unit])=&gt;{const gross=net*f/yieldRatio;const missing=Math.max(0,gross-available);return `&lt;article class=&quot;b2-productline&quot;&gt;&lt;div class=&quot;b2-row&quot;&gt;&lt;h3&gt;${name}&lt;/h3&gt;${missing?tag(`Faltan ${F(missing)} ${unit}`,&#x27;warn&#x27;):tag(&#x27;Disponible&#x27;)}&lt;/div&gt;&lt;div class=&quot;b2-qtygrid&quot;&gt;&lt;div&gt;&lt;span&gt;Neto&lt;/span&gt;&lt;b&gt;${F(net*f)} ${unit}&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Bruto&lt;/span&gt;&lt;b&gt;${F(gross)} ${unit}&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Disponible&lt;/span&gt;&lt;b&gt;${F(available)} ${unit}&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;${yieldRatio&lt;1?`&lt;p class=&quot;b2-muted&quot; style=&quot;margin-top:11px&quot;&gt;Limpieza: ${yieldRatio*100}% de rendimiento&lt;/p&gt;`:&#x27;&#x27;}&lt;/article&gt;`;}).join(&#x27;&#x27;);}
function tasks(){return [&#x27;Pesar la mise en place&#x27;,&#x27;Cocinar y triturar la crema&#x27;,&#x27;Comprobar rendimiento final&#x27;].map((t,i)=&gt;`&lt;div class=&quot;b2-task&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;${id}-task-${i}&quot; data-task=&quot;${i}&quot; ${s.done[i]?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;label for=&quot;${id}-task-${i}&quot;&gt;&lt;span&gt;${t}&lt;/span&gt;&lt;small&gt;${i===0?&#x27;10:00 · Lucía&#x27;:i===1?&#x27;11:00 · Lucía&#x27;:&#x27;12:00 · Chef&#x27;}&lt;/small&gt;&lt;/label&gt;&lt;/div&gt;`).join(&#x27;&#x27;);}
function home(){if(s.role===&#x27;Commis&#x27;)return H(&#x27;EL MIRADOR · TU JORNADA&#x27;,&#x27;Buen día, &lt;br&gt;Lucía.&#x27;,&#x27;La crema de calabaza necesita tu atención.&#x27;)+`&lt;div class=&quot;b2-service&quot;&gt;&lt;span class=&quot;b2-muted&quot;&gt;Tu próximo pase&lt;/span&gt;&lt;span class=&quot;b2-time&quot;&gt;12:30&lt;/span&gt;&lt;/div&gt;${tasks()}&lt;div class=&quot;b2-actions&quot;&gt;${full(&#x27;Abrir producción &#x27;+I(&#x27;arrow-up-right&#x27;),&#x27;production&#x27;)}&lt;/div&gt;`;
const missing=Math.max(0,3*(s.portions/20)/.8-s.stock)&gt;0?2:1;
return H(&#x27;EL MIRADOR · MIÉRCOLES 30&#x27;,&#x27;Buen día, &lt;br&gt;Joab.&#x27;)+`&lt;div class=&quot;b2-homegrid&quot;&gt;&lt;div&gt;&lt;div class=&quot;b2-service&quot;&gt;&lt;div&gt;&lt;div class=&quot;b2-muted&quot;&gt;Servicio de mediodía&lt;/div&gt;&lt;div style=&quot;font-size:14px;margin-top:3px&quot;&gt;2 preparaciones en cocina&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;text-align:right&quot;&gt;&lt;div class=&quot;b2-eyebrow&quot; style=&quot;font-size:9px;margin-bottom:4px&quot;&gt;PRÓXIMO PASE&lt;/div&gt;&lt;div class=&quot;b2-time&quot;&gt;12:30&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;b2-overline&quot;&gt;&lt;h2&gt;Continuar donde estabas&lt;/h2&gt;&lt;/div&gt;&lt;article class=&quot;b2-focus&quot;&gt;&lt;div class=&quot;b2-row&quot;&gt;${tag(&#x27;En marcha&#x27;)}&lt;span class=&quot;b2-muted&quot;&gt;Lucía · 12:00&lt;/span&gt;&lt;/div&gt;&lt;h2 class=&quot;b2-dish&quot;&gt;Crema de&lt;br&gt;calabaza&lt;/h2&gt;&lt;div class=&quot;b2-numbers&quot;&gt;&lt;div class=&quot;b2-big&quot;&gt;${s.produced}&lt;span&gt;/ ${s.portions}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;b2-muted&quot;&gt;porciones listas&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;b2-track&quot;&gt;&lt;span style=&quot;width:${Math.min(s.produced/s.portions*100,100)}%&quot;&gt;&lt;/span&gt;&lt;/div&gt;${full(&#x27;Continuar producción &#x27;+I(&#x27;arrow-up-right&#x27;),&#x27;production&#x27;)}&lt;/article&gt;&lt;/div&gt;&lt;div&gt;&lt;button class=&quot;b2-attention&quot; data-go=&quot;orders&quot;&gt;&lt;span class=&quot;b2-attention-icon&quot;&gt;${I(&#x27;package-search&#x27;)}&lt;/span&gt;&lt;span&gt;${missing} faltantes para resolver&lt;small&gt;Revisar cantidades y proveedores&lt;/small&gt;&lt;/span&gt;${I(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;div class=&quot;b2-next&quot;&gt;&lt;div class=&quot;b2-eyebrow&quot;&gt;DESPUÉS, EN EL PASE&lt;/div&gt;&lt;div class=&quot;b2-nextrow&quot;&gt;&lt;div&gt;&lt;h3 class=&quot;b2-dish&quot;&gt;Merluza al horno&lt;/h3&gt;&lt;span class=&quot;b2-muted&quot;&gt;Mateo · 40 porciones · 12:20&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;b2-square&quot; data-go=&quot;fish&quot; aria-label=&quot;Abrir merluza al horno&quot;&gt;${I(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;b2-attention&quot; data-go=&quot;capture&quot;&gt;&lt;span class=&quot;b2-attention-icon&quot; style=&quot;background:#273120;color:var(--b-accent)&quot;&gt;${I(&#x27;scan-line&#x27;)}&lt;/span&gt;&lt;span&gt;Tu receta, desde una foto&lt;small&gt;Capturas, mensajes o cuadernos&lt;/small&gt;&lt;/span&gt;${I(&#x27;plus&#x27;)}&lt;/button&gt;&lt;p class=&quot;b2-footnote&quot;&gt;Última sincronización · 09:42&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`;}
function recipes(){const list=[[&#x27;Crema de calabaza&#x27;,&#x27;Compartidas&#x27;,&#x27;20 porciones · 5 L&#x27;,&#x27;recipe&#x27;],[&#x27;Merluza al horno&#x27;,&#x27;Compartidas&#x27;,&#x27;40 porciones · Pescados&#x27;,&#x27;fish&#x27;],[&#x27;Cebolla confitada&#x27;,&#x27;Privadas&#x27;,s.recipeSaved?&#x27;Revisada por el chef&#x27;:&#x27;Captura por revisar&#x27;,&#x27;capture&#x27;],[&#x27;Masa de focaccia&#x27;,&#x27;Privadas&#x27;,&#x27;2 bandejas · Panadería&#x27;,&#x27;focaccia&#x27;]].filter(([name,type])=&gt;name.toLowerCase().includes(s.search.toLowerCase())&amp;&amp;(s.filter===&#x27;Todas&#x27;||type===s.filter));return `&lt;div class=&quot;b2-inline-head&quot;&gt;${H(&#x27;RECETARIO&#x27;,&#x27;Tu recetario.&#x27;)}${B(I(&#x27;scan-line&#x27;)+&#x27; Capturar receta&#x27;,&#x27;capture&#x27;)}&lt;/div&gt;&lt;div class=&quot;b2-searchbox&quot;&gt;${I(&#x27;search&#x27;)}&lt;input class=&quot;b2-search&quot; data-search placeholder=&quot;Buscar una preparación&quot; aria-label=&quot;Buscar una preparación&quot; value=&quot;${E(s.search)}&quot;&gt;&lt;/div&gt;&lt;div class=&quot;b2-tabs&quot;&gt;${[&#x27;Todas&#x27;,&#x27;Compartidas&#x27;,&#x27;Privadas&#x27;].map(x=&gt;`&lt;button data-filter=&quot;${x}&quot; aria-pressed=&quot;${s.filter===x}&quot;&gt;${x}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;b2-recipe-grid&quot;&gt;${list.map(([name,type,meta,action],i)=&gt;`&lt;button class=&quot;b2-recipe-cell&quot; data-go=&quot;${action}&quot;&gt;&lt;div class=&quot;b2-row&quot;&gt;&lt;span class=&quot;b2-recipe-index&quot;&gt;RECETA / 0${i+1}&lt;/span&gt;&lt;span class=&quot;b2-tag neutral&quot;&gt;${I(type===&#x27;Privadas&#x27;?&#x27;lock-keyhole&#x27;:&#x27;users&#x27;)}${type===&#x27;Privadas&#x27;?&#x27;Tuya · privada&#x27;:&#x27;Equipo&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;h2 class=&quot;b2-dish&quot;&gt;${name}&lt;/h2&gt;&lt;div class=&quot;b2-cellfoot&quot;&gt;&lt;span&gt;${meta}&lt;/span&gt;${I(&#x27;arrow-up-right&#x27;)}&lt;/div&gt;&lt;/button&gt;`).join(&#x27;&#x27;)||&#x27;&lt;div class=&quot;b2-empty&quot;&gt;&lt;h2&gt;No encontramos esa receta&lt;/h2&gt;&lt;p class=&quot;b2-sub&quot;&gt;Probá otro nombre.&lt;/p&gt;&lt;/div&gt;&#x27;}&lt;/div&gt;&lt;div class=&quot;b2-actions&quot;&gt;${full(I(&#x27;plus&#x27;)+&#x27; Escribir una receta&#x27;,&#x27;manual&#x27;)}&lt;/div&gt;`;}
function recipe(){const fish=s.screen===&#x27;fish&#x27;;const bread=s.screen===&#x27;focaccia&#x27;;const name=fish?&#x27;Merluza al horno&#x27;:bread?&#x27;Masa de focaccia&#x27;:&#x27;Crema de calabaza&#x27;;return back(&#x27;Recetario&#x27;,&#x27;recipes&#x27;)+`&lt;div class=&quot;b2-row&quot;&gt;${tag(bread?&#x27;Tuya · privada&#x27;:&#x27;Compartida con cocina&#x27;)}&lt;span class=&quot;b2-muted&quot;&gt;Versión ${bread?&#x27;1&#x27;:&#x27;3&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;h1 class=&quot;b2-dish&quot; style=&quot;font-size:49px;margin:22px 0!important&quot;&gt;${name}&lt;/h1&gt;&lt;div class=&quot;b2-facts&quot;&gt;&lt;div&gt;&lt;b&gt;${fish?&#x27;40&#x27;:bread?&#x27;2&#x27;:&#x27;20&#x27;}&lt;/b&gt;&lt;span&gt;${bread?&#x27;Bandejas&#x27;:&#x27;Porciones&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;${fish?&#x27;8 kg&#x27;:bread?&#x27;3,2 kg&#x27;:&#x27;5 L&#x27;}&lt;/b&gt;&lt;span&gt;Rendimiento&lt;/span&gt;&lt;/div&gt;${!bread?`&lt;div&gt;&lt;b&gt;${fish?&#x27;200 g&#x27;:&#x27;250 mL&#x27;}&lt;/b&gt;&lt;span&gt;Por porción&lt;/span&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;${fish||bread?`&lt;div class=&quot;b2-panel&quot;&gt;&lt;h2&gt;${fish?&#x27;Mise en place lista&#x27;:&#x27;Receta personal&#x27;}&lt;/h2&gt;&lt;p class=&quot;b2-sub&quot;&gt;${fish?&#x27;Mateo prepara el servicio de las 12:20. 40 porciones de pescado neto de 200 g.&#x27;:&#x27;Borrador del recetario personal. Ingredientes y procedimiento por completar en esta muestra.&#x27;}&lt;/p&gt;&lt;/div&gt;`:`&lt;div class=&quot;b2-tabs&quot;&gt;${[&#x27;Ingredientes&#x27;,&#x27;Pasos&#x27;].map(t=&gt;`&lt;button data-recipetab=&quot;${t}&quot; aria-pressed=&quot;${s.recipeTab===t}&quot;&gt;${t}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;button data-go=&quot;share&quot;&gt;Compartir&lt;/button&gt;&lt;/div&gt;${s.share?`&lt;div class=&quot;b2-panel&quot;&gt;&lt;h2&gt;Acceso de lectura&lt;/h2&gt;&lt;p class=&quot;b2-sub&quot;&gt;El autor conserva la propiedad de la receta.&lt;/p&gt;&lt;label class=&quot;b2-check&quot;&gt;&lt;input type=&quot;checkbox&quot; checked data-share&gt;Compartir con el equipo de El Mirador&lt;/label&gt;${full(&#x27;Guardar acceso&#x27;,&#x27;save-share&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}${s.recipeTab===&#x27;Ingredientes&#x27;?`${[[&#x27;Calabaza limpia&#x27;,&#x27;3 kg&#x27;],[&#x27;Cebolla limpia&#x27;,&#x27;600 g&#x27;],[&#x27;Caldo de verduras&#x27;,&#x27;2 L&#x27;],[&#x27;Crema de leche&#x27;,&#x27;400 mL&#x27;],[&#x27;Aceite de oliva&#x27;,&#x27;80 mL&#x27;],[&#x27;Sal&#x27;,&#x27;Al final&#x27;]].map(([n,q])=&gt;`&lt;div class=&quot;b2-ingredient&quot;&gt;&lt;span&gt;${n}&lt;/span&gt;&lt;b&gt;${q}&lt;/b&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;p class=&quot;b2-sub&quot;&gt;Cantidades netas. Contiene lácteos.&lt;/p&gt;`:`${[[&#x27;Preparar&#x27;,&#x27;Pelar, pesar netos y cortar la calabaza y la cebolla.&#x27;],[&#x27;Rehogar&#x27;,&#x27;Cocinar la cebolla en aceite a fuego suave, sin dorar.&#x27;],[&#x27;Cocinar&#x27;,&#x27;Agregar calabaza y caldo. Cocinar hasta que esté tierna.&#x27;],[&#x27;Terminar&#x27;,&#x27;Triturar, incorporar crema y ajustar sal. Comprobar el rendimiento final de 5 L.&#x27;]].map(([title,text],i)=&gt;`&lt;div class=&quot;b2-step&quot;&gt;&lt;span&gt;0${i+1}&lt;/span&gt;&lt;div&gt;&lt;strong&gt;${title}&lt;/strong&gt;&lt;p&gt;${text}&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}`}` }&lt;div class=&quot;b2-actions&quot;&gt;${full(fish||bread?&#x27;Volver al recetario&#x27;:&#x27;Planificar producción &#x27;+I(&#x27;arrow-up-right&#x27;),fish||bread?&#x27;recipes&#x27;:&#x27;production&#x27;)}&lt;/div&gt;&lt;p class=&quot;b2-footnote&quot;&gt;${I(&#x27;download&#x27;)} Disponible en este dispositivo&lt;/p&gt;`;}

function production(){return back(&#x27;Cocina de hoy&#x27;,&#x27;home&#x27;)+`&lt;div class=&quot;b2-row&quot;&gt;${tag(&#x27;En producción&#x27;)}&lt;span class=&quot;b2-muted&quot;&gt;Lucía · 12:00&lt;/span&gt;&lt;/div&gt;&lt;h1 class=&quot;b2-dish&quot; style=&quot;font-size:47px;margin:20px 0!important&quot;&gt;Crema de calabaza&lt;/h1&gt;&lt;div class=&quot;b2-tabs&quot;&gt;${[&#x27;Cantidades&#x27;,&#x27;Tareas&#x27;,&#x27;Registro&#x27;].map(t=&gt;`&lt;button data-productiontab=&quot;${t}&quot; aria-pressed=&quot;${s.productionTab===t}&quot;&gt;${t}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${s.productionTab===&#x27;Cantidades&#x27;?`&lt;div class=&quot;b2-two&quot;&gt;&lt;div&gt;&lt;div class=&quot;b2-panel&quot; style=&quot;margin-top:0&quot;&gt;&lt;div class=&quot;b2-row&quot;&gt;&lt;h2&gt;Porciones previstas&lt;/h2&gt;&lt;span class=&quot;b2-tag neutral&quot;&gt;250 mL c/u&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;b2-counter&quot;&gt;&lt;button class=&quot;b2-square&quot; data-go=&quot;minus&quot; aria-label=&quot;Restar cinco porciones&quot;&gt;${I(&#x27;minus&#x27;)}&lt;/button&gt;&lt;input data-portions type=&quot;number&quot; min=&quot;1&quot; max=&quot;500&quot; value=&quot;${s.portions}&quot; aria-label=&quot;Porciones previstas&quot;&gt;&lt;button class=&quot;b2-square&quot; data-go=&quot;plus&quot; aria-label=&quot;Sumar cinco porciones&quot;&gt;${I(&#x27;plus&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;b2-row&quot;&gt;&lt;span class=&quot;b2-muted&quot;&gt;Rendimiento objetivo&lt;/span&gt;&lt;span style=&quot;font-size:21px&quot;&gt;${F(s.portions*.25)} L&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;b2-link&quot; data-go=&quot;recipe&quot;&gt;Consultar receta y versión ${I(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;b2-overline&quot;&gt;&lt;h2&gt;Para esta producción&lt;/h2&gt;&lt;span class=&quot;b2-muted&quot;&gt;Versión 3&lt;/span&gt;&lt;/div&gt;${stockRows()}&lt;p clas function orders(){const f=s.portions/20;const items=[[&#x27;Huerta del Sur&#x27;,&#x27;Calabaza&#x27;,Math.max(0,3*f/.8-s.stock),&#x27;kg&#x27;],[&#x27;Lácteos Costa&#x27;,&#x27;Crema de leche&#x27;,Math.max(0,.4*f-.3),&#x27;L&#x27;]].filter(x=&gt;x[2]&gt;0);return H(&#x27;COMPRAS A PROVEEDORES&#x27;,&#x27;Pedidos.&#x27;,&#x27;Cantidades para la producción de crema.&#x27;)+`&lt;div class=&quot;b2-row&quot;&gt;&lt;span class=&quot;b2-muted&quot;&gt;${items.length} proveedores · de ejemplo&lt;/span&gt;${tag(s.orderStatus,s.orderStatus===&#x27;Borrador&#x27;?&#x27;warn&#x27;:&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;b2-two&quot;&gt;${items.map(([supplier,name,q,unit])=&gt;`&lt;article class=&quot;b2-order&quot;&gt;&lt;span class=&quot;b2-eyebrow&quot;&gt;PROVEEDOR&lt;/span&gt;&lt;h2&gt;${supplier}&lt;/h2&gt;&lt;div class=&quot;b2-ingredient&quot;&gt;&lt;span&gt;${name}&lt;/span&gt;&lt;b&gt;${F(q)} ${unit}&lt;/b&gt;&lt;/div&gt;&lt;p class=&quot;b2-sub&quot;&gt;Precio, presentación y entrega por confirmar.&lt;/p&gt;&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${items.length?`&lt;div class=&quot;b2-wide-limit&quot;&gt;${s.orderStatus===&#x27;Borrador&#x27;?full(&#x27;Revisar antes de enviar &#x27;+I(&#x27;arrow-right&#x27;),&#x27;review-order&#x27;):s.orderStatus===&#x27;Enviado&#x27;?full(&#x27;Registrar confirmación&#x27;,&#x27;confirm-order&#x27;):s.orderStatus===&#x27;Confirmado&#x27;?full(&#x27;Registrar recepción&#x27;,&#x27;receive-order&#x27;):&#x27;&lt;div class=&quot;b2-toast&quot;&gt;Recepción registrada en la muestra.&lt;/div&gt;&#x27;}${s.confirm?`&lt;div class=&quot;b2-panel&quot;&gt;&lt;h2&gt;${items.length} pedidos separados&lt;/h2&gt;&lt;p class=&quot;b2-sub&quot;&gt;Revisá cantidades y proveedores. Esta muestra no envía mensajes.&lt;/p&gt;${s.offline?&#x27;&lt;div class=&quot;b2-offline&quot;&gt;Sin conexión. El pedido queda en borrador.&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;div class=&quot;b2-actions&quot;&gt;${full(&#x27;Simular envío&#x27;,&#x27
