#brigade-v2 .b2-capture .b2-pagehead{margin-bottom:15px}#brigade-v2 .b2-capture .b2-pagehead .b2-dish{font-size:39px;margin:9px 0!important}#brigade-v2 .b2-capture .b2-tabs{margin-bottom:18px}#brigade-v2 .b2-capture .b2-track{display:none}#brigade-v2 .b2-capture .b2-callout{margin:15px 0;padding:12px 15px}#brigade-v2 .b2-capture .b2-question{margin:17px 0!important}#brigade-v2 .b2-capture .b2-choice{min-height:54px;padding:13px;margin:8px 0}#brigade-v2 .b2-capture .b2-actions{margin-top:17px}#brigade-v2 .b2-capture .b2-sub{font-size:13px;line-height:1.45}#brigade-v2 .b2-frame input,#brigade-v2 .b2-frame textarea{scroll-margin-block:90px 140px}
</style>
<div id="brigade-v2" lang="es">
 <div class="viz-carousel" aria-label="Brigade, diseño móvil y escritorio" data-previous-label="Anterior" data-next-label="Siguiente">
  <section data-variant="Celular · primero" aria-label="Brigade en celular"><div class="b2-stage viz-dotted-background"><div class="b2-frame b2-phone" id="brigade-v2-phone" aria-label="Brigade móvil"></div></div></section>
  <section data-variant="Escritorio" aria-label="Brigade en escritorio" hidden><div class="b2-stage"><div class="b2-frame" id="brigade-v2-desktop" aria-label="Brigade escritorio"></div></div></section>
 </div>
</div>
<script>
(()=>{
const root=document.getElementById('brigade-v2');
const I=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const E=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=v=>new Intl.NumberFormat('es-UY',{maximumFractionDigits:2}).format(v);
const initial={screen:'home',offline:false,role:'Chef',portions:40,produced:20,pending:0,recipe:'Crema de calabaza',recipeTab:'Ingredientes',productionTab:'Cantidades',captureTab:'Revisión',source:'WhatsApp',question:0,salt:'',weight:'',reviewed:false,recipeSaved:false,search:'',filter:'Todas',done:[true,false,false],orderStatus:'Borrador',stock:5,toast:'',confirm:false,sourceNote:'',eventName:'Almuerzo de bienvenida'};
const apps={};
function mount(id,key){
const app=document.getElementById(id);const previous=window.openai?.widgetState?.privateContent?.v2?.[key];const s={...initial,...(previous||{}),done:[...(previous?.done||initial.done)]};apps[key]=s;
const options={glow:.19};
const B=(text,action,quiet=false,disabled=false)=>`<button type="button" class="b2-button ${quiet?'quiet':''}" data-go="${action}" ${disabled?'disabled':''}>${text}</button>`;
const full=(text,action,disabled=false)=>`<button type="button" class="b2-button full" data-go="${action}" ${disabled?'disabled':''}>${text}</button>`;
const tag=(text,kind='')=>`<span class="b2-tag ${kind}"><span class="b2-dot"></span>${text}</span>`;
const H=(eyebrow,title,sub='')=>`<div class="b2-pagehead"><div class="b2-eyebrow">${eyebrow}</div><h1>${title}</h1>${sub?`<p class="b2-sub">${sub}</p>`:''}</div>`;
const back=(text,action)=>`<button class="b2-link b2-back" data-go="${action}">${I('arrow-left')}${text}</button>`;
const allNav=[['home','Hoy','sun'],['recipes','Recetas','book-open'],['production','Cocina','cooking-pot'],['orders','Pedidos','shopping-basket'],['stock','Stock','boxes'],['tasks','Equipo','users'],['events','Eventos','calendar-days']];
function persist(){window.openai?.setWidgetState?.({modelContent:{revision:2,view:key,page:s.screen,role:s.role,offline:s.offline},privateContent:{v2:Object.fromEntries(Object.entries(apps).map(([k,v])=>[k,{...v,toast:''}]))}}).catch(()=>{});}
function stockRows(){const f=s.portions/20;return [['Calabaza',3,.8,s.stock,'kg'],['Cebolla',.6,.9,2,'kg'],['Crema de leche',.4,1,.3,'L'],['Caldo',2,1,5,'L']].map(([name,net,yieldRatio,available,unit])=>{const gross=net*f/yieldRatio;const missing=Math.max(0,gross-available);return `<article class="b2-productline"><div class="b2-row"><h3>${name}</h3>${missing?tag(`Faltan ${F(missing)} ${unit}`,'warn'):tag('Disponible')}</div><div class="b2-qtygrid"><div><span>Neto</span><b>${F(net*f)} ${unit}</b></div><div><span>Bruto</span><b>${F(gross)} ${unit}</b></div><div><span>Disponible</span><b>${F(available)} ${unit}</b></div></div>${yieldRatio<1?`<p class="b2-muted" style="margin-top:11px">Limpieza: ${yieldRatio*100}% de rendimiento</p>`:''}</article>`;}).join('');}
function tasks(){return ['Pesar la mise en place','Cocinar y triturar la crema','Comprobar rendimiento final'].map((t,i)=>`<div class="b2-task"><input type="checkbox" id="${id}-task-${i}" data-task="${i}" ${s.done[i]?'checked':''}><label for="${id}-task-${i}"><span>${t}</span><small>${i===0?'10:00 · Lucía':i===1?'11:00 · Lucía':'12:00 · Chef'}</small></label></div>`).join('');}
function home(){if(s.role==='Commis')return H('EL MIRADOR · TU JORNADA','Buen día, <br>Lucía.','La crema de calabaza necesita tu atención.')+`<div class="b2-service"><span class="b2-muted">Tu próximo pase</span><span class="b2-time">12:30</span></div>${tasks()}<div class="b2-actions">${full('Abrir producción '+I('arrow-up-right'),'production')}</div>`;
const missing=Math.max(0,3*(s.portions/20)/.8-s.stock)>0?2:1;
return H('EL MIRADOR · MIÉRCOLES 30','Buen día, <br>Joab.')+`<div class="b2-homegrid"><div><div class="b2-service"><div><div class="b2-muted">Servicio de mediodía</div><div style="font-size:14px;margin-top:3px">2 preparaciones en cocina</div></div><div style="text-align:right"><div class="b2-eyebrow" style="font-size:9px;margin-bottom:4px">PRÓXIMO PASE</div><div class="b2-time">12:30</div></div></div><div class="b2-overline"><h2>Continuar donde estabas</h2></div><article class="b2-focus"><div class="b2-row">${tag('En marcha')}<span class="b2-muted">Lucía · 12:00</span></div><h2 class="b2-dish">Crema de<br>calabaza</h2><div class="b2-numbers"><div class="b2-big">${s.produced}<span>/ ${s.portions}</span></div><div class="b2-muted">porciones listas</div></div><div class="b2-track"><span style="width:${Math.min(s.produced/s.portions*100,100)}%"></span></div>${full('Continuar producción '+I('arrow-up-right'),'production')}</article></div><div><button class="b2-attention" data-go="orders"><span class="b2-attention-icon">${I('package-search')}</span><span>${missing} faltantes para resolver<small>Revisar cantidades y proveedores</small></span>${I('arrow-up-right')}</button><div class="b2-next"><div class="b2-eyebrow">DESPUÉS, EN EL PASE</div><div class="b2-nextrow"><div><h3 class="b2-dish">Merluza al horno</h3><span class="b2-muted">Mateo · 40 porciones · 12:20</span></div><button class="b2-square" data-go="fish" aria-label="Abrir merluza al horno">${I('arrow-up-right')}</button></div></div><button class="b2-attention" data-go="capture"><span class="b2-attention-icon" style="background:#273120;color:var(--b-accent)">${I('scan-line')}</span><span>Tu receta, desde una foto<small>Capturas, mensajes o cuadernos</small></span>${I('plus')}</button><p class="b2-footnote">Última sincronización · 09:42</p></div></div>`;}
function recipes(){const list=[['Crema de calabaza','Compartidas','20 porciones · 5 L','recipe'],['Merluza al horno','Compartidas','40 porciones · Pescados','fish'],['Cebolla confitada','Privadas',s.recipeSaved?'Revisada por el chef':'Captura por revisar','capture'],['Masa de focaccia','Privadas','2 bandejas · Panadería','focaccia']].filter(([name,type])=>name.toLowerCase().includes(s.search.toLowerCase())&&(s.filter==='Todas'||type===s.filter));return `<div class="b2-inline-head">${H('RECETARIO','Tu recetario.')}${B(I('scan-line')+' Capturar receta','capture')}</div><div class="b2-searchbox">${I('search')}<input class="b2-search" data-search placeholder="Buscar una preparación" aria-label="Buscar una preparación" value="${E(s.search)}"></div><div class="b2-tabs">${['Todas','Compartidas','Privadas'].map(x=>`<button data-filter="${x}" aria-pressed="${s.filter===x}">${x}</button>`).join('')}</div><div class="b2-recipe-grid">${list.map(([name,type,meta,action],i)=>`<button class="b2-recipe-cell" data-go="${action}"><div class="b2-row"><span class="b2-recipe-index">RECETA / 0${i+1}</span><span class="b2-tag neutral">${I(type==='Privadas'?'lock-keyhole':'users')}${type==='Privadas'?'Tuya · privada':'Equipo'}</span></div><h2 class="b2-dish">${name}</h2><div class="b2-cellfoot"><span>${meta}</span>${I('arrow-up-right')}</div></button>`).join('')||'<div class="b2-empty"><h2>No encontramos esa receta</h2><p class="b2-sub">Probá otro nombre.</p></div>'}</div><div class="b2-actions">${full(I('plus')+' Escribir una receta','manual')}</div>`;}
function recipe(){const fish=s.screen==='fish';const bread=s.screen==='focaccia';const name=fish?'Merluza al horno':bread?'Masa de focaccia':'Crema de calabaza';return back('Recetario','recipes')+`<div class="b2-row">${tag(bread?'Tuya · privada':'Compartida con cocina')}<span class="b2-muted">Versión ${bread?'1':'3'}</span></div><h1 class="b2-dish" style="font-size:49px;margin:22px 0!important">${name}</h1><div class="b2-facts"><div><b>${fish?'40':bread?'2':'20'}</b><span>${bread?'Bandejas':'Porciones'}</span></div><div><b>${fish?'8 kg':bread?'3,2 kg':'5 L'}</b><span>Rendimiento</span></div>${!bread?`<div><b>${fish?'200 g':'250 mL'}</b><span>Por porción</span></div>`:''}</div>${fish||bread?`<div class="b2-panel"><h2>${fish?'Mise en place lista':'Receta personal'}</h2><p class="b2-sub">${fish?'Mateo prepara el servicio de las 12:20. 40 porciones de pescado neto de 200 g.':'Borrador del recetario personal. Ingredientes y procedimiento por completar en esta muestra.'}</p></div>`:`<div class="b2-tabs">${['Ingredientes','Pasos'].map(t=>`<button data-recipetab="${t}" aria-pressed="${s.recipeTab===t}">${t}</button>`).join('')}<button data-go="share">Compartir</button></div>${s.share?`<div class="b2-panel"><h2>Acceso de lectura</h2><p class="b2-sub">El autor conserva la propiedad de la receta.</p><label class="b2-check"><input type="checkbox" checked data-share>Compartir con el equipo de El Mirador</label>${full('Guardar acceso','save-share')}</div>`:''}${s.recipeTab==='Ingredientes'?`${[['Calabaza limpia','3 kg'],['Cebolla limpia','600 g'],['Caldo de verduras','2 L'],['Crema de leche','400 mL'],['Aceite de oliva','80 mL'],['Sal','Al final']].map(([n,q])=>`<div class="b2-ingredient"><span>${n}</span><b>${q}</b></div>`).join('')}<p class="b2-sub">Cantidades netas. Contiene lácteos.</p>`:`${[['Preparar','Pelar, pesar netos y cortar la calabaza y la cebolla.'],['Rehogar','Cocinar la cebolla en aceite a fuego suave, sin dorar.'],['Cocinar','Agregar calabaza y caldo. Cocinar hasta que esté tierna.'],['Terminar','Triturar, incorporar crema y ajustar sal. Comprobar el rendimiento final de 5 L.']].map(([title,text],i)=>`<div class="b2-step"><span>0${i+1}</span><div><strong>${title}</strong><p>${text}</p></div></div>`).join('')}`}` }<div class="b2-actions">${full(fish||bread?'Volver al recetario':'Planificar producción '+I('arrow-up-right'),fish||bread?'recipes':'production')}</div><p class="b2-footnote">${I('download')} Disponible en este dispositivo</p>`;}
function capture(){return `<div class="b2-wide-limit b2-capture"><div class="b2-pagehead"><div class="b2-eyebrow">CAPTURA · REVISAR RECETA</div><h1 class="b2-dish">Cebolla confitada</h1></div><div class="b2-tabs">${['Revisión','Original'].map(t=>`<button data-capturetab="${t}" aria-pressed="${s.captureTab===t}">${t}</button>`).join('')}<button data-go="add-images">${I('image-plus')} Imágenes</button></div>${s.addImages?`<label class="b2-field">Elegí una o varias imágenes<input type="file" accept="image/*" multiple data-files></label><p class="b2-muted">La muestra conserva las imágenes en tu dispositivo; no las envía.</p>`:''}${s.captureTab==='Original'?`<div class="b2-row"><h2>Fuente de la receta</h2><button class="b2-link" data-go="toggle-source">${s.source==='WhatsApp'?'Ver cuaderno':'Ver WhatsApp'}</button></div><div class="b2-source ${s.source==='Cuaderno'?'b2-hand':''}"><span class="b2-muted">${s.source} · ejemplo recreado</span><p>Cebolla confitada<br>2 kg cebolla y sal<br>aceite 100 ml<br>cortar fino fuego bajo tapada<br>destapar terminar sin dorar</p></div><label class="b2-field">Texto extraído, editable<textarea data-source-note>${E(s.sourceNote||'Cebolla confitada\n2 kg cebolla y sal\nAceite 100 ml\nFino, fuego bajo, tapada.\nDestapar y terminar sin dorar.')}</textarea></label>${full('Volver a la revisión','return-review')}`:review()}</div>`;}
function review(){if(s.recipeSaved)return `<div class="b2-empty">${I('circle-check')}<h2>Ya está en tu recetario.</h2><p class="b2-sub">Cebolla confitada · Privada</p></div><div class="b2-panel"><span class="b2-tag">Confirmado por vos</span><p class="b2-sub">Sal: ${s.salt==='inicio'?'al inicio, para sudar la cebolla':s.salt==='final'?'al final de la cocción':E(s.saltNote||'según tu indicación')}. Cebolla: 2 kg ${s.weight==='neto'?'limpios':'antes de limpiar'}.</p></div>${full('Volver al recetario','recipes')}`;
if(s.question===2)return `<div class="b2-eyebrow">ÚLTIMA REVISIÓN</div><h2 class="b2-dish">Cebolla confitada</h2><div class="b2-ingredient"><span>Cebolla ${s.weight==='neto'?'limpia':'sin limpiar'}</span><b>2 kg</b></div><div class="b2-ingredient"><span>Aceite</span><b>100 mL</b></div><div class="b2-callout"><strong>Tu indicación sobre la sal</strong><br>${s.salt==='inicio'?'Agregar al inicio para sudar la cebolla.':s.salt==='final'?'Agregar al final de la cocción.':E(s.saltNote||'')}</div><p class="b2-sub">Rendimiento final pendiente de medir. Todavía no se puede escalar por porciones.</p><label class="b2-check"><input type="checkbox" data-reviewed ${s.reviewed?'checked':''}>Revisé cantidades y procedimiento.</label>${full('Guardar receta privada '+I('check'),'save-recipe',!s.reviewed)}<button class="b2-link" data-go="previous-question">${I('arrow-left')} Volver a las respuestas</button>`;
const first=s.question===0;return `<div class="b2-row"><span class="b2-eyebrow">${first?'01':'02'} / 02 · CONFIRMAR</span>${tag('Necesita tu criterio','warn')}</div><div class="b2-track" style="margin:15px 0 26px"><span style="width:${first?'50':'100'}%"></span></div><div class="b2-callout"><span class="b2-muted">En la fuente dice</span><br><strong>“${first?'cebolla y sal':'2 kg cebolla'}”</strong></div><h2 class="b2-question">${first?'¿Cuándo agregás<br>la sal?':'¿Cuándo pesás<br>la cebolla?'}</h2>${(first?[['inicio','Al inicio, para sudar'],['final','Al final de la cocción'],['otro','Otra indicación']]:[['bruto','Antes de limpiar · peso bruto'],['neto','Ya limpia · peso neto']]).map(([value,text])=>`<label class="b2-choice"><input type="radio" name="${id}-${first?'salt':'weight'}" data-answer="${first?'salt':'weight'}" value="${value}" ${(first?s.salt:s.weight)===value?'checked':''}>${text}</label>`).join('')}${first&&s.salt==='otro'?`<label class="b2-field">Tu indicación<textarea data-salt-note>${E(s.saltNote||'')}</textarea></label>`:''}<p class="b2-sub">${first?'La nota no indica el momento. Elegí la técnica que usás.':'Así evitamos confundir la cantidad útil con lo que hay que comprar.'}</p><div class="b2-actions">${full((first?'Siguiente':'Revisar receta')+' '+I('arrow-right'),'next-question',first?!s.salt:!s.weight)}</div>${!first?'<button class="b2-link" data-go="previous-question">Volver</button>':''}`;}
function production(){return back('Cocina de hoy','home')+`<div class="b2-row">${tag('En producción')}<span class="b2-muted">Lucía · 12:00</span></div><h1 class="b2-dish" style="font-size:47px;margin:20px 0!important">Crema de calabaza</h1><div class="b2-tabs">${['Cantidades','Tareas','Registro'].map(t=>`<button data-productiontab="${t}" aria-pressed="${s.productionTab===t}">${t}</button>`).join('')}</div>${s.productionTab==='Cantidades'?`<div class="b2-two"><div><div class="b2-panel" style="margin-top:0"><div class="b2-row"><h2>Porciones previstas</h2><span class="b2-tag neutral">250 mL c/u</span></div><div class="b2-counter"><button class="b2-square" data-go="minus" aria-label="Restar cinco porciones">${I('minus')}</button><input data-portions type="number" min="1" max="500" value="${s.portions}" aria-label="Porciones previstas"><button class="b2-square" data-go="plus" aria-label="Sumar cinco porciones">${I('plus')}</button></div><div class="b2-row"><span class="b2-muted">Rendimiento objetivo</span><span style="font-size:21px">${F(s.portions*.25)} L</span></div></div><button class="b2-link" data-go="recipe">Consultar receta y versión ${I('arrow-up-right')}</button></div><div><div class="b2-overline"><h2>Para esta producción</h2><span class="b2-muted">Versión 3</span></div>${stockRows()}<p class="b2-sub">Aceite: ${F(.08*s.portions/20)} L. Sal al final, según receta.</p>${s.role!=='Commis'?`<div class="b2-actions">${full('Comprar faltantes '+I('arrow-right'),'orders')}</div>`:''}</div></div>`:s.productionTab==='Tareas'?`<div class="b2-wide-limit">${tasks()}<div class="b2-actions">${full('Registrar una tanda','go-register')}</div></div>`:`<div class="b2-wide-limit"><div class="b2-panel"><div class="b2-eyebrow">PRODUCIDO HASTA AHORA</div><div class="b2-big" style="margin-top:20px">${s.produced}<span>/ ${s.portions}</span></div><p class="b2-sub">porciones terminadas</p></div><label class="b2-field">Porciones nuevas de esta tanda<input data-batch type="number" min="1" value="10"></label>${full('Revisar registro','review-batch')}${s.batchConfirm?`<div class="b2-panel"><h2>Sumar ${s.batchConfirm} porciones</h2><p class="b2-sub">El total pasará a ${s.produced+s.batchConfirm}. ${s.offline?'Quedará guardado aquí hasta recuperar conexión.':''}</p><div class="b2-actions">${full('Confirmar registro','confirm-batch')}${B('Cancelar','cancel-batch',true)}</div></div>`:''}</div>`}`;}
function orders(){const f=s.portions/20;const items=[['Huerta del Sur','Calabaza',Math.max(0,3*f/.8-s.stock),'kg'],['Lácteos Costa','Crema de leche',Math.max(0,.4*f-.3),'L']].filter(x=>x[2]>0);return H('COMPRAS A PROVEEDORES','Pedidos.','Cantidades para la producción de crema.')+`<div class="b2-row"><span class="b2-muted">${items.length} proveedores · de ejemplo</span>${tag(s.orderStatus,s.orderStatus==='Borrador'?'warn':'')}</div><div class="b2-two">${items.map(([supplier,name,q,unit])=>`<article class="b2-order"><span class="b2-eyebrow">PROVEEDOR</span><h2>${supplier}</h2><div class="b2-ingredient"><span>${name}</span><b>${F(q)} ${unit}</b></div><p class="b2-sub">Precio, presentación y entrega por confirmar.</p></article>`).join('')}</div>${items.length?`<div class="b2-wide-limit">${s.orderStatus==='Borrador'?full('Revisar antes de enviar '+I('arrow-right'),'review-order'):s.orderStatus==='Enviado'?full('Registrar confirmación','confirm-order'):s.orderStatus==='Confirmado'?full('Registrar recepción','receive-order'):'<div class="b2-toast">Recepción registrada en la muestra.</div>'}${s.confirm?`<div class="b2-panel"><h2>${items.length} pedidos separados</h2><p class="b2-sub">Revisá cantidades y proveedores. Esta muestra no envía mensajes.</p>${s.offline?'<div class="b2-offline">Sin conexión. El pedido queda en borrador.</div>':''}<div class="b2-actions">${full('Simular envío','send-order',s.offline)}${B('Volver','cancel-order',true)}</div></div>`:''}</div>`:'<div class="b2-empty"><h2>Todo cubierto</h2><p class="b2-sub">No hay faltantes para esta cantidad.</p></div>'}<p class="b2-footnote">Los pedidos no se envían automáticamente al reconectar.</p>`;}
function stock(){return H('EXISTENCIAS','Ingredientes.','Stock utilizable · Última actualización 09:42')+`${[['Calabaza',`${F(s.stock)} kg`,'Depósito'],['Cebolla','2 kg','Depósito'],['Crema de leche','0,3 L','Cámara 1'],['Caldo de verduras','5 L','Cámara 1']].map(([name,q,place])=>`<div class="b2-productline"><div class="b2-row"><h3>${name}</h3><span style="font-size:24px;font-variant-numeric:tabular-nums">${q}</span></div><span class="b2-muted">${place}</span></div>`).join('')}<div class="b2-actions">${full(I('package-plus')+' Registrar entrada','stock-form')}</div>${s.stockForm?`<div class="b2-panel"><h2>Entrada de calabaza</h2><label class="b2-field">Cantidad recibida · kg<input type="number" data-stock min="0.01" step="0.01" value="2.5"></label>${full('Confirmar entrada','save-stock')}</div>`:''}`;}
function team(){return H('EQUIPO / TAREAS','Tu equipo.','Trabajo de hoy · El Mirador')+`<div class="b2-two"><section><div class="b2-service"><div><h2>Lucía Costa</h2><p class="b2-muted">Commis · Cocina caliente</p></div><span class="b2-avatar">LC</span></div>${tasks()}<button class="b2-link" data-go="production">Abrir su producción ${I('arrow-up-right')}</button></section><section><div class="b2-service"><div><h2>Mateo Torres</h2><p class="b2-muted">Sous chef · Pescados</p></div><span class="b2-avatar">MT</span></div><div class="b2-productline">${tag('Mise en place lista')}<h3 class="b2-dish" style="font-size:33px">Merluza al horno</h3><span class="b2-muted">40 porciones · Para las 12:20</span></div><button class="b2-link" data-go="fish">Ver preparación ${I('arrow-up-right')}</button></section></div>`;}
function events(){return H('EVENTOS','Eventos.','Una ocasión más en tu cocina.')+`<article class="b2-focus"><div class="b2-row">${tag('Vie 02 · Octubre')}<span class="b2-muted">13:00</span></div><h2 class="b2-dish">${E(s.eventName)}</h2><div class="b2-facts"><div><b>32</b><span>Comensales</span></div><div><b>Terraza</b><span>Ubicación</span></div></div>${full('Ver producción vinculada','event-production')}</article><div class="b2-actions">${full(I('pencil')+' Editar evento','edit-event')}</div>${s.eventForm?`<div class="b2-panel"><label class="b2-field">Nombre<input data-event-name value="${E(s.eventName)}"></label><label class="b2-field">Notas<textarea>Confirmar restricciones alimentarias.</textarea></label>${full('Guardar evento','save-event')}</div>`:''}`;}
function more(){return H('EL MIRADOR','Toda tu cocina.','Elegí dónde querés trabajar.')+`<div class="b2-menu-grid">${[['stock','Stock','boxes'],['tasks','Equipo','users'],['events','Eventos','calendar-days'],['capture','Capturar','scan-line'],['sync','Conexión','cloud-check'],['manual','Nueva receta','notebook-pen']].filter(([p])=>s.role!=='Commis'||!['stock','events'].includes(p)).map(([p,n,i])=>`<button data-go="${p}">${I(i)}${n}</button>`).join('')}</div>`;}
function sync(){return H('GUARDADO Y CONEXIÓN','Tu trabajo,<br>a salvo.')+`<div class="b2-panel"><div class="b2-row">${tag(s.offline?'Sin conexión':'Conectado',s.offline?'warn':'')}<span class="b2-muted">Última: 09:42</span></div><div class="b2-facts"><div><b>${s.pending}</b><span>Cambios pendientes</span></div><div><b>4</b><span>Recetas disponibles</span></div></div><p class="b2-sub">Los registros guardados aquí se sincronizan al recuperar conexión. Los pedidos requieren envío explícito.</p></div>${full('Reintentar sincronización','reconnect')}<p class="b2-footnote">Sincronización simulada para revisar el diseño.</p>`;}
function manual(){return H('RECETA NUEVA','Tu manera<br>de hacerlo.','Se guarda privada hasta que decidas compartirla.')+`<label class="b2-field">Nombre de la preparación<input data-manual-name placeholder="Por ejemplo: salsa de tomate"></label><label class="b2-field">Rendimiento y unidad<input placeholder="Por ejemplo: 2 L"></label><label class="b2-field">Ingredientes<textarea placeholder="Ingrediente, cantidad y unidad"></textarea></label><label class="b2-field">Procedimiento<textarea placeholder="Escribí los pasos en orden"></textarea></label>${full('Guardar borrador','save-manual')}`;}
function render(keepScroll=false){const pos=app.querySelector('.b2-scroll')?.scrollTop||0;let active=s.screen;if(['recipe','fish','focaccia','capture','manual'].includes(active))active='recipes';if(['stock','events','sync'].includes(active)||(active==='tasks'&&s.role!=='Commis'))active='more';
const pages={home,recipes,recipe,fish:recipe,focaccia:recipe,capture,production,orders,stock,tasks:team,events,more,sync,manual};const content=(pages[s.screen]||home)();
const nav=allNav.filter(([p])=>s.role!=='Commis'||!['orders','stock','events'].includes(p)).map(([p,n,i],index)=>`<button data-go="${p}" class="${index>=4?'b2-wideitem':''}" ${s.screen===p||active===p?'aria-current="page"':''}>${I(i)}<span>${n}</span></button>`).join('');
app.style.setProperty('--b-glow',`rgba(204,238,166,${options.glow})`);
app.innerHTML=`<header class="b2-header"><div class="b2-brand">brigade<em>.</em></div><div class="b2-headright"><button class="b2-sync" data-go="sync">${I(s.offline?'cloud-off':'cloud-check')}${s.offline?'Sin conexión':'Al día'}</button><span class="b2-avatar" aria-label="${s.role==='Commis'?'Lucía, commis':'Joab, chef'}">${s.role==='Commis'?'LC':'JB'}</span></div></header><div class="b2-scroll" role="region" aria-label="Contenido de ${s.screen}"><main class="b2-content">${s.offline&&s.screen!=='sync'?`<div class="b2-offline">Guardado en este dispositivo · ${s.pending} pendientes</div>`:''}${s.toast?`<div class="b2-toast" role="status">${E(s.toast)}</div>`:''}${content}<p class="b2-footnote">Brigade · Propuesta 02 · Datos de ejemplo</p></main></div><div class="b2-dock-area"><nav class="b2-dock" aria-label="Navegación principal">${nav}<button class="b2-moreitem" data-go="more" ${active==='more'?'aria-current="page"':''}>${I('grid-2x2')}<span>Más</span></button></nav></div>`;
if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});if(keepScroll)app.querySelector('.b2-scroll').scrollTop=pos;
}
function action(go){s.toast='';let keep=false;const screens=['home','recipes','recipe','fish','focaccia','capture','production','orders','stock','tasks','events','more','sync','manual'];if(screens.includes(go)){if(s.role==='Commis'&&['orders','stock','events'].includes(go)){s.toast='Esta sección requiere permisos del chef.';}else s.screen=go;s.confirm=false;}
else if(go==='plus'||go==='minus'){s.portions=Math.max(1,Math.min(500,s.portions+(go==='plus'?5:-5)));keep=true;}
else if(go==='next-question'){if(s.question===0&&s.salt==='otro'&&!s.saltNote?.trim()){s.toast='Escribí tu indicación antes de continuar.';}else if((s.question===0&&s.salt)||(s.question===1&&s.weight))s.question++;}
else if(go==='previous-question')s.question=Math.max(0,s.question-1);
else if(go==='return-review')s.captureTab='Revisión';
else if(go==='toggle-source')s.source=s.source==='WhatsApp'?'Cuaderno':'WhatsApp';
else if(go==='add-images'){s.addImages=!s.addImages;keep=true;}
else if(go==='save-recipe'&&s.reviewed){s.recipeSaved=true;s.question=2;}
else if(go==='go-register')s.productionTab='Registro';
else if(go==='review-batch'){const q=Number(app.querySelector('[data-batch]').value);if(Number.isInteger(q)&&q>0)s.batchConfirm=q;else s.toast='Ingresá una cantidad entera mayor que cero.';keep=true;}
else if(go==='confirm-batch'&&s.batchConfirm){s.produced+=s.batchConfirm;s.batchConfirm=0;if(s.offline)s.pending++;s.toast=s.offline?'Tanda guardada aquí. Pendiente de sincronización.':'Tanda registrada en la muestra.';}
else if(go==='cancel-batch'){s.batchConfirm=0;keep=true;}
else if(go==='review-order'){s.confirm=true;keep=true;}
else if(go==='cancel-order'){s.confirm=false;keep=true;}
else if(go==='send-order'&&!s.offline){s.orderStatus='Enviado';s.confirm=false;s.toast='Envío simulado. No se contactó a proveedores.';}
else if(go==='confirm-order'){s.orderStatus='Confirmado';s.toast='Confirmación registrada en esta muestra.';}
else if(go==='receive-order'){s.orderStatus='Recibido';s.toast='Recepción simulada. El registro detallado se diseñará con cantidades reales.';}
else if(go==='stock-form'){s.stockForm=true;keep=true;}
else if(go==='save-stock'){const q=Number(app.querySelector('[data-stock]').value);if(q>0){s.stock+=q;s.stockForm=false;if(s.offline)s.pending++;s.toast=`Entrada de ${F(q)} kg registrada en la muestra.`;}else s.toast='Ingresá una cantidad mayor que cero.';}
else if(go==='edit-event'){s.eventForm=true;keep=true;}
else if(go==='save-event'){const n=app.querySelector('[data-event-name]').value.trim();if(n){s.eventName=n;s.eventForm=false;s.toast='Evento guardado en la muestra.';}else s.toast='Ingresá el nombre del evento.';}
else if(go==='event-production')s.toast='Viernes 2 · Crema de calabaza · 32 porciones. Esta producción es independiente del plan de hoy.';
else if(go==='reconnect'){s.offline=false;s.pending=0;s.toast='Conexión recuperada en la muestra. Los pedidos conservan su estado.';}
else if(go==='save-manual'){const n=app.querySelector('[data-manual-name]').value.trim();s.toast=n?`Borrador de “${n}” guardado en la muestra.`:'Ingresá un nombre para la receta.';}
else if(go==='share'){s.share=!s.share;keep=true;}
else if(go==='save-share'){s.share=false;s.toast='Acceso de lectura actualizado en la muestra.';}
render(keep);persist();}
app.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b&&!b.disabled)action(b.dataset.go);for(const [attr,field]of [['filter','filter'],['recipetab','recipeTab'],['capturetab','captureTab'],['productiontab','productionTab']]){const target=e.target.closest(`[data-${attr}]`);if(target){s[field]=target.dataset[attr];render(true);persist();}}});
app.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-answer]')){s[t.dataset.answer]=t.value;s.reviewed=false;}else if(t.matches('[data-reviewed]'))s.reviewed=t.checked;else if(t.matches('[data-task]')){s.done[Number(t.dataset.task)]=t.checked;if(s.offline)s.pending++;}else if(t.matches('[data-portions]')){const n=Number(t.value);if(Number.isInteger(n)&&n>0&&n<=500)s.portions=n;else s.toast='Usá entre 1 y 500 porciones para esta muestra.';}else if(t.matches('[data-files]'))s.toast=`${t.files.length} imagen(es) seleccionadas. La extracción de esta muestra es ficticia.`;else return;render(true);persist();});
app.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-search]')){const caret=t.selectionStart;s.search=t.value;render(true);const input=app.querySelector('[data-search]');input.focus();input.setSelectionRange(caret,caret);}if(t.matches('[data-salt-note]'))s.saltNote=t.value;if(t.matches('[data-source-note]'))s.sourceNote=t.value;});
render();if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{if(s.role==='Commis'&&['orders','stock','events'].includes(s.screen))s.screen='home';render(true);persist();}});tweak.addToggle(s,'offline',{label:'Sin conexión'});tweak.addSelect(s,'role',{label:'Vista por rol',options:['Chef','Commis']});tweak.addSlider(options,'glow',{label:'Intensidad del brillo',min:.05,max:.3,step:.01});}
return {state:s,render};
}
const phone=mount('brigade-v2-phone','phone');const desktop=mount('brigade-v2-desktop','desktop');
window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent?.v2;if(saved)for(const[key,a]of[['phone',phone],['desktop',desktop]])if(saved[key]){const incoming={...saved[key]};delete incoming.toast;const current={...a.state};delete current.toast;if(JSON.stringify(current)!==JSON.stringify(incoming)){Object.assign(a.state,incoming);a.render(true);}}});
})();
</script>
